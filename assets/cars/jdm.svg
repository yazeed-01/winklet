<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="440" height="200">
  <!-- JDM sports coupe (90s Supra-style): orange metallic, liftback, hoop wing. Original artwork, no badges. -->
  <defs>
    <filter id="sh" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e1900"/>
      <stop offset=".14" stop-color="#cf430c"/>
      <stop offset=".40" stop-color="#ff7a1f"/>
      <stop offset=".50" stop-color="#ffa45c"/>
      <stop offset=".60" stop-color="#ff7a1f"/>
      <stop offset=".86" stop-color="#cf430c"/>
      <stop offset="1" stop-color="#5e1900"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a1800"/><stop offset=".55" stop-color="#ff9445"/><stop offset="1" stop-color="#8a2a00"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06090c"/><stop offset=".3" stop-color="#2d3e50"/><stop offset=".5" stop-color="#121a22"/><stop offset="1" stop-color="#04070a"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa4ba"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="tl"><stop offset="0" stop-color="#ff7070"/><stop offset=".6" stop-color="#d40000"/><stop offset="1" stop-color="#5a0000"/></radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="116" cy="54" rx="98" ry="42" fill="#000" opacity=".55" filter="url(#sh)"/>

  <g fill="#0b0b0b">
    <rect x="42" y="6.5" width="30" height="12" rx="4"/><rect x="42" y="81.5" width="30" height="12" rx="4"/>
    <rect x="152" y="8.5" width="28" height="11" rx="4"/><rect x="152" y="80.5" width="28" height="11" rx="4"/>
  </g>

  <path d="M26 50 C26 26 30 15 50 13 L64 11 C90 9 140 9 160 12 C186 15 204 24 209 40 C211 46 211 54 209 60 C204 76 186 85 160 88 C140 91 90 91 64 89 L50 87 C30 85 26 74 26 50 Z"
        fill="url(#paint)" stroke="#3e1000" stroke-width="1"/>

  <!-- hood creases and nose intake -->
  <path d="M148 22 C170 25 190 33 201 44 M148 78 C170 75 190 67 201 56" stroke="#a8380a" stroke-width="1.3" fill="none"/>
  <path d="M168 47 L184 46.5 L184 53.5 L168 53 Z" fill="#7a2604" opacity=".7"/>
  <rect x="206" y="43" width="3.5" height="14" rx="1.5" fill="#151515"/>

  <!-- greenhouse -->
  <path d="M80 18.5 L118 17.5 L144 14 L122 15 Z" fill="#0d0d0d"/>
  <path d="M80 81.5 L118 82.5 L144 86 L122 85 Z" fill="#0d0d0d"/>
  <path d="M118 21 L142 17 C150 34 150 66 142 83 L118 79 C113 62 113 38 118 21 Z" fill="url(#glass)"/>
  <path d="M124 24 L138 21 C141 30 142 37 142 43 L126 43 Z" fill="#fff" opacity=".14"/>
  <path d="M80 22 L118 21 C113 38 113 62 118 79 L80 78 C77 62 77 38 80 22 Z" fill="url(#paint)"/>
  <path d="M84 33 L114 32 L114 37 L84 38 Z" fill="url(#gloss)"/>
  <path d="M58 25 L80 22 C77 38 77 62 80 78 L58 75 C54 62 54 38 58 25 Z" fill="url(#glass)"/>
  <path d="M61 30 L76 28 L76 40 L60 41 Z" fill="#fff" opacity=".1"/>

  <!-- mirrors -->
  <ellipse cx="137" cy="10" rx="5.5" ry="3.2" fill="url(#paint)" stroke="#3e1000" stroke-width=".8"/>
  <ellipse cx="137" cy="90" rx="5.5" ry="3.2" fill="url(#paint)" stroke="#3e1000" stroke-width=".8"/>

  <!-- headlights -->
  <path d="M188 18.5 C197 21 204 27.5 207.5 35 L198 33.5 C195 27.5 192 23.5 184 20 Z" fill="url(#hl)"/>
  <path d="M188 81.5 C197 79 204 72.5 207.5 65 L198 66.5 C195 72.5 192 76.5 184 80 Z" fill="url(#hl)"/>
  <path d="M186 25 L198 31" stroke="#ffb27a" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M186 75 L198 69" stroke="#ffb27a" stroke-width="1.6" stroke-linecap="round"/>

  <!-- round tail lights -->
  <g fill="url(#tl)">
    <circle cx="29.5" cy="24" r="3.6"/><circle cx="28" cy="33" r="3.6"/>
    <circle cx="28" cy="67" r="3.6"/><circle cx="29.5" cy="76" r="3.6"/>
  </g>

  <!-- hoop wing -->
  <rect x="38" y="20" width="10" height="4" fill="#2e0b00"/>
  <rect x="38" y="76" width="10" height="4" fill="#2e0b00"/>
  <path d="M33 13 L45 12 L45 88 L33 87 Z" fill="url(#wing)" stroke="#2e0b00" stroke-width="1"/>
  <path d="M37 16 L42 16 L42 84 L37 84 Z" fill="#fff" opacity=".18"/>

  <!-- long body reflection -->
  <path d="M150 44 C170 43 188 44 200 47 L200 49 C188 47 170 46.5 150 47.5 Z" fill="#fff" opacity=".25"/>
</svg>
