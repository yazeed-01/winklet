<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="440" height="200">
  <!-- German sport coupe (BMW M-style): deep metallic blue, carbon roof, power-dome hood, quad exhausts. Original artwork, no badges. -->
  <defs>
    <filter id="sh" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06143a"/>
      <stop offset=".14" stop-color="#123fa6"/>
      <stop offset=".40" stop-color="#2468e6"/>
      <stop offset=".50" stop-color="#6aa0ff"/>
      <stop offset=".60" stop-color="#2468e6"/>
      <stop offset=".86" stop-color="#123fa6"/>
      <stop offset="1" stop-color="#06143a"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a63d8"/><stop offset=".5" stop-color="#8fb8ff"/><stop offset="1" stop-color="#2a63d8"/>
    </linearGradient>
    <pattern id="carbon" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#15171b"/>
      <rect width="2" height="2" fill="#2a2d33"/><rect x="2" y="2" width="2" height="2" fill="#2a2d33"/>
    </pattern>
    <linearGradient id="roofshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080b"/><stop offset=".3" stop-color="#2c3d4f"/><stop offset=".52" stop-color="#101820"/><stop offset="1" stop-color="#04070a"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b8cc"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="tl" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#5a0000"/><stop offset="1" stop-color="#ff2e2e"/>
    </linearGradient>
    <radialGradient id="pipe"><stop offset="0" stop-color="#0d0d0d"/><stop offset=".55" stop-color="#1e1e1e"/><stop offset=".7" stop-color="#e0e0e0"/><stop offset="1" stop-color="#6d6d6d"/></radialGradient>
  </defs>

  <ellipse cx="116" cy="54" rx="98" ry="42" fill="#000" opacity=".55" filter="url(#sh)"/>

  <g fill="#0b0b0b">
    <rect x="40" y="6.5" width="31" height="12" rx="3.5"/><rect x="40" y="81.5" width="31" height="12" rx="3.5"/>
    <rect x="156" y="7.5" width="29" height="11" rx="3.5"/><rect x="156" y="81.5" width="29" height="11" rx="3.5"/>
  </g>

  <path d="M24 50 C24 25 28 13 46 11.5 L168 11.5 C192 11.5 206 19 209 34 C210.5 42 210.5 58 209 66 C206 81 192 88.5 168 88.5 L46 88.5 C28 87 24 75 24 50 Z"
        fill="url(#paint)" stroke="#040c22" stroke-width="1"/>

  <!-- power dome + hood lines -->
  <path d="M146 38 C166 37 186 39 198 42 L198 58 C186 61 166 63 146 62 C142 56 142 44 146 38 Z" fill="url(#dome)" opacity=".55"/>
  <path d="M140 22 C164 23 188 27 203 34 M140 78 C164 77 188 73 203 66" stroke="#0d2f80" stroke-width="1.3" fill="none"/>

  <!-- twin grille + nose -->
  <rect x="204.5" y="37.5" width="5" height="11" rx="2.2" fill="#0e0e0e" stroke="#bfc5cc" stroke-width=".9"/>
  <rect x="204.5" y="51.5" width="5" height="11" rx="2.2" fill="#0e0e0e" stroke="#bfc5cc" stroke-width=".9"/>

  <!-- greenhouse -->
  <path d="M74 18.5 L114 17.5 L140 14.5 L118 15.5 Z" fill="#0d0d0d"/>
  <path d="M74 81.5 L114 82.5 L140 85.5 L118 84.5 Z" fill="#0d0d0d"/>
  <path d="M114 21 L139 17.5 C146 34 146 66 139 82.5 L114 79 C109.5 62 109.5 38 114 21 Z" fill="url(#glass)"/>
  <path d="M120 24 L135 21.5 C138 30 139 36 139 42 L122 42 Z" fill="#fff" opacity=".14"/>
  <path d="M76 22 L114 21 C109.5 38 109.5 62 114 79 L76 78 C73 62 73 38 76 22 Z" fill="url(#carbon)"/>
  <path d="M76 22 L114 21 C109.5 38 109.5 62 114 79 L76 78 C73 62 73 38 76 22 Z" fill="url(#roofshade)"/>
  <path d="M54 25 L76 22 C73 38 73 62 76 78 L54 75 C50 62 50 38 54 25 Z" fill="url(#glass)"/>

  <!-- mirrors -->
  <path d="M130 11 L140 10 L139 5 L131 6 Z" fill="url(#paint)" stroke="#040c22" stroke-width=".8"/>
  <path d="M130 89 L140 90 L139 95 L131 94 Z" fill="url(#paint)" stroke="#040c22" stroke-width=".8"/>

  <!-- angular headlights with LED brow -->
  <path d="M186 15 C196 17 203 22 207 29 L207 34 L198 32 C195 25 191 20 182 17 Z" fill="url(#hl)"/>
  <path d="M186 85 C196 83 203 78 207 71 L207 66 L198 68 C195 75 191 80 182 83 Z" fill="url(#hl)"/>
  <path d="M184 19.5 L199 28" stroke="#7fd0ff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M184 80.5 L199 72" stroke="#7fd0ff" stroke-width="1.4" stroke-linecap="round"/>

  <!-- L-shaped tail lights + trunk lip -->
  <path d="M25 15.5 L40 13.5 L40 18 L30 19.5 L29 31 L24.5 31.5 Z" fill="url(#tl)"/>
  <path d="M25 84.5 L40 86.5 L40 82 L30 80.5 L29 69 L24.5 68.5 Z" fill="url(#tl)"/>
  <path d="M33 24 C31 38 31 62 33 76" stroke="#040c22" stroke-width="1.8" fill="none"/>

  <!-- quad exhaust, two per side -->
  <g fill="url(#pipe)">
    <circle cx="23" cy="34" r="2.5"/><circle cx="23" cy="40" r="2.5"/>
    <circle cx="23" cy="60" r="2.5"/><circle cx="23" cy="66" r="2.5"/>
  </g>

  <!-- reflections -->
  <path d="M150 30 C172 29 192 31 203 35 L203 37 C192 33.5 172 32 150 33 Z" fill="#fff" opacity=".3"/>
  <path d="M34 30 C42 28.5 48 28 54 28.5 L54 30 C48 30 42 30.5 34 32 Z" fill="#fff" opacity=".25"/>
</svg>
