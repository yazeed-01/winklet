<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="440" height="200">
  <!-- American front-engine sports car (Corvette-style): racing yellow, long hood, wide haunches, twin stripes. Original artwork, no badges. -->
  <defs>
    <filter id="sh" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4300"/>
      <stop offset=".14" stop-color="#d9a400"/>
      <stop offset=".40" stop-color="#ffd21a"/>
      <stop offset=".50" stop-color="#fff07a"/>
      <stop offset=".60" stop-color="#ffd21a"/>
      <stop offset=".86" stop-color="#d9a400"/>
      <stop offset="1" stop-color="#5c4300"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080b"/><stop offset=".3" stop-color="#2b3a48"/><stop offset=".52" stop-color="#101820"/><stop offset="1" stop-color="#04070a"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb2c6"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a0000"/><stop offset="1" stop-color="#ff3b3b"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d0d"/><stop offset=".5" stop-color="#2a2a2a"/><stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="pipe"><stop offset="0" stop-color="#111"/><stop offset=".55" stop-color="#222"/><stop offset=".7" stop-color="#d8d8d8"/><stop offset="1" stop-color="#777"/></radialGradient>
  </defs>

  <ellipse cx="116" cy="54" rx="98" ry="43" fill="#000" opacity=".55" filter="url(#sh)"/>

  <g fill="#0b0b0b">
    <rect x="40" y="5.5" width="34" height="13" rx="4"/><rect x="40" y="81.5" width="34" height="13" rx="4"/>
    <rect x="154" y="7.5" width="28" height="11" rx="4"/><rect x="154" y="81.5" width="28" height="11" rx="4"/>
  </g>

  <path d="M22 50 C22 28 26 15 44 11 C58 8 70 11 84 13.5 L140 14 C150 12 162 9 176 10.5 C196 13 206 27 210 42 C211.5 47 211.5 53 210 58 C206 73 196 87 176 89.5 C162 91 150 88 140 86 L84 86.5 C70 89 58 92 44 89 C26 85 22 72 22 50 Z"
        fill="url(#paint)" stroke="#3d2c00" stroke-width="1"/>

  <!-- twin racing stripes (run under the glass) -->
  <path d="M24 43 L210 43 L210 47.5 L24 47.5 Z" fill="url(#stripe)"/>
  <path d="M24 52.5 L210 52.5 L210 57 L24 57 Z" fill="url(#stripe)"/>

  <!-- hood vent + creases -->
  <path d="M146 40 L170 41 L170 59 L146 60 Z" fill="#141414" opacity=".85"/>
  <g stroke="#3a3a3a" stroke-width="1"><path d="M149 44 L167 44.5"/><path d="M149 48 L167 48.3"/><path d="M149 52 L167 51.7"/><path d="M149 56 L167 55.5"/></g>
  <path d="M136 24 C160 25 186 30 202 40 M136 76 C160 75 186 70 202 60" stroke="#b38700" stroke-width="1.2" fill="none"/>

  <!-- greenhouse set far back -->
  <path d="M68 19 L98 18.5 L122 15.5 L102 16.5 Z" fill="#0d0d0d"/>
  <path d="M68 81 L98 81.5 L122 84.5 L102 83.5 Z" fill="#0d0d0d"/>
  <path d="M98 21 L122 17.5 C130 34 130 66 122 82.5 L98 79 C93 62 93 38 98 21 Z" fill="url(#glass)"/>
  <path d="M104 24 L118 21.5 C121 30 122 36 122 42 L106 42 Z" fill="#fff" opacity=".14"/>
  <path d="M68 22 L98 21 C93 38 93 62 98 79 L68 78 C65 62 65 38 68 22 Z" fill="url(#paint)"/>
  <path d="M68 43 L96 43 L96 47.5 L68 47.5 Z M68 52.5 L96 52.5 L96 57 L68 57 Z" fill="url(#stripe)"/>
  <path d="M48 26 L68 22 C65 38 65 62 68 78 L48 74 C44 62 44 38 48 26 Z" fill="url(#glass)"/>

  <!-- mirrors -->
  <ellipse cx="118" cy="10.5" rx="5.5" ry="3.2" fill="url(#paint)" stroke="#3d2c00" stroke-width=".8"/>
  <ellipse cx="118" cy="89.5" rx="5.5" ry="3.2" fill="url(#paint)" stroke="#3d2c00" stroke-width=".8"/>

  <!-- slim slanted headlights -->
  <path d="M184 15 C195 18 203 24 207 31 L201 31 C196 25 191 21 180 17.5 Z" fill="url(#hl)"/>
  <path d="M184 85 C195 82 203 76 207 69 L201 69 C196 75 191 79 180 82.5 Z" fill="url(#hl)"/>

  <!-- tail lights + ducktail -->
  <path d="M24 17 L34 15 L33 30 L23.5 31 Z" fill="url(#tl)"/>
  <path d="M24 83 L34 85 L33 70 L23.5 69 Z" fill="url(#tl)"/>
  <path d="M27 20 C25 35 25 65 27 80" stroke="#3d2c00" stroke-width="1.6" fill="none"/>

  <!-- quad exhaust, centre exit -->
  <g fill="url(#pipe)">
    <circle cx="22.5" cy="41" r="2.6"/><circle cx="22.5" cy="46.5" r="2.6"/>
    <circle cx="22.5" cy="53.5" r="2.6"/><circle cx="22.5" cy="59" r="2.6"/>
  </g>

  <!-- reflections -->
  <path d="M130 33 C160 31.5 186 33 200 37 L200 39 C186 35.5 160 34 130 35.5 Z" fill="#fff" opacity=".35"/>
  <path d="M30 34 C38 32 52 31 60 32 L60 33.5 C52 33 40 33.5 30 35.5 Z" fill="#fff" opacity=".3"/>
</svg>
