[package]
name = "winklet"
version = "0.2.1"
edition = "2024"
description = "Winklet: a tiny winking Dynamic Island for Windows"
license = "MIT"
repository = "https://github.com/yazeed-01/winklet"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Native GPU renderer, no accessibility/qt/software extras => smaller binary, less RAM.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "raw-window-handle-06",
    "system-tray",
    "image-default-formats",
    "unstable-winit-030",
] }
uuid = { version = "1.29.0", features = ["v4"] }
png = "0.18"
# Shelf > Send: QR code and the small local web server the phone talks to
qrcode = { version = "0.14", default-features = false }
tiny_http = "0.12"
# the interface macro for the undocumented default-device COM interface (same version windows uses)
windows-core = "0.62.2"

[dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Media_Audio_Endpoints",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_EventLog",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Rpc",
    "Win32_System_Wmi",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # game mode + screen time
    "Win32_Graphics_Dxgi",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Performance",
    "Win32_System_Time",
    "Win32_UI_Input_XboxController",
]

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

