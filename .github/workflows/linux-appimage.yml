name: Linux AppImage

# Runs when a release is published and attaches the AppImage to it (or by hand: Actions tab).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build environment (Ubuntu 22.04)
        run: docker build -t winklet-linux packaging/linux

      - name: Build the AppImage
        run: |
          docker run --rm -v "$PWD:/src" -e CARGO_TARGET_DIR=/src/target \
            --user "$(id -u):$(id -g)" winklet-linux sh packaging/linux/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Winklet-AppImage
          path: dist/*.AppImage

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        # a release that already carries an AppImage (built with its checksums) keeps it
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -q '\.AppImage$'; then
            echo "The release already has an AppImage"
          else
            gh release upload "$TAG" dist/*.AppImage
          fi
